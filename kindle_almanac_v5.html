<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1.0">
<title>日历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:600px;height:800px;background:#f0ece0;color:#111;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;}
.ln{width:100%;height:1px;background:#aaa8a0;flex-shrink:0;}

/* ── 顶部：冲煞 + 时辰 ── */
#s-chong{display:grid;grid-template-columns:1fr 1fr;padding:14px 28px 12px;flex-shrink:0;}
.cb{display:flex;flex-direction:column;gap:4px;}
.cb:first-child{padding-right:20px;border-right:1px solid #ccc9bc;}
.cb:last-child{padding-left:20px;}
.cl{font-size:12px;letter-spacing:2px;color:#888;margin-bottom:2px;}
.cm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.cm-main{font-size:28px;color:#1a1a1a;letter-spacing:1px;line-height:1;}
.cm-sub{font-size:20px;color:#555;letter-spacing:1px;line-height:1;}

/* ── 宜忌 ── */
#s-yiji{display:grid;grid-template-columns:1fr 1fr;padding:10px 28px 12px;flex-shrink:0;}
.yc{display:flex;flex-direction:column;gap:6px;}
.yc:first-child{padding-right:20px;border-right:1px solid #ccc9bc;}
.yc:last-child{padding-left:20px;}
.yl{font-size:12px;letter-spacing:2px;color:#888;}
.yi-row{display:flex;gap:16px;}
.ji-row{display:flex;gap:16px;}
.yi{font-size:26px;color:#1a1a1a;letter-spacing:2px;line-height:1;}
.ji{font-size:26px;color:#555;letter-spacing:2px;line-height:1;}

/* ── 节气 ── */
#s-jieqi{padding:10px 28px;font-size:22px;color:#333;letter-spacing:2px;
  text-align:center;flex-shrink:0;min-height:44px;}

/* ── 时间主区 ── */
#s-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;}
#time{font-size:130px;font-weight:300;letter-spacing:-5px;line-height:1;color:#080808;}
#lunar-gz{display:flex;gap:20px;margin-top:10px;align-items:baseline;}
#lunar-date{font-size:18px;color:#333;letter-spacing:1px;}
#ganzhi{font-size:15px;color:#666;letter-spacing:2px;}

/* ── 迷你日历 ── */
#s-cal{padding:12px 24px 16px;flex-shrink:0;}
#cal-header{text-align:center;font-size:14px;letter-spacing:1px;color:#555;margin-bottom:8px;}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dow{text-align:center;font-size:12px;color:#888;padding:2px 0;letter-spacing:1px;font-weight:500;}
.day{text-align:center;font-size:15px;color:#333;padding:4px 0;line-height:1.2;font-weight:500;}
.day.today{background:#1a1a1a;color:#f0ece0;border-radius:2px;font-weight:700;}
.day.other{color:#bbb;font-weight:400;}
.day.jq{text-decoration:underline;text-underline-offset:2px;}
</style>
</head>
<body>

<div id="s-chong">
  <div class="cb">
    <div class="cl">冲 · 煞</div>
    <div class="cm">
      <span class="cm-main" id="chong-sx"></span>
      <span class="cm-sub" id="sha-dir"></span>
    </div>
  </div>
  <div class="cb">
    <div class="cl">时辰</div>
    <div class="cm">
      <span class="cm-main" id="sc-name"></span>
      <span class="cm-sub" id="sc-range"></span>
    </div>
    <div style="font-size:15px;color:#666;margin-top:3px;" id="sc-yun"></div>
  </div>
</div>
<div class="ln"></div>

<div id="s-yiji">
  <div class="yc">
    <div class="yl">宜</div>
    <div class="yi-row" id="yi-list"></div>
  </div>
  <div class="yc">
    <div class="yl">忌</div>
    <div class="ji-row" id="ji-list"></div>
  </div>
</div>
<div class="ln"></div>

<div id="s-jieqi"></div>
<div class="ln"></div>

<div id="s-mid">
  <div id="time">--:--</div>
  <div id="lunar-gz">
    <div id="lunar-date">农历──月──</div>
    <div id="ganzhi">──年──月──日</div>
  </div>
</div>
<div class="ln"></div>

<div id="s-cal">
  <div id="cal-header"></div>
  <div id="cal-grid"></div>
</div>

<script>
var TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var SX=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var LM=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LD=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var ME=['January','February','March','April','May','June',
        'July','August','September','October','November','December'];
var ME_CN=['一月','二月','三月','四月','五月','六月',
           '七月','八月','九月','十月','十一月','十二月'];

var LI=[
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06aa0,0x0a6b6,0x056a0,0x02b40,0x0aae4,
  0x0a570,0x05260,0x0f263,0x0d950,0x0da57,0x056a0,0x096d0,0x04bd4,0x04ad0,0x0a4d0,
  0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,
  0x0aa50,0x1b255,0x06d20,0x0ada0
];

function getLunar(date){
  var BASE=new Date(1900,0,31),offset=Math.floor((date-BASE)/86400000);
  var i,leap=false,temp=0,lm=0,year;
  for(i=1900;i<2100&&offset>0;i++){
    temp=(LI[i-1900]&0xf)?384:354;
    if(LI[i-1900]&0xf0000){lm=(LI[i-1900]&0xf0000)>>16;temp+=lm>0?((LI[i-1900]&0x10000)?30:29):0;}
    offset-=temp;
  }
  if(offset<0){offset+=temp;i--;}
  year=i;lm=(LI[i-1900]&0xf0000)>>16;leap=false;
  for(i=1;i<13&&offset>0;i++){
    if(lm>0&&i==lm+1&&!leap){i--;leap=true;}
    temp=(LI[year-1900]&(0x10000>>i))?30:29;
    if(leap&&i==lm+1)leap=false;
    offset-=temp;
  }
  if(offset==0&&lm>0&&i==lm+1){if(leap)leap=false;else{leap=true;i--;}}
  if(offset<0){offset+=temp;i--;}
  return{year:year,month:i,day:offset+1,leap:leap};
}

function getGZ(date){
  var y=date.getFullYear(),m=date.getMonth()+1;
  var yi=(y-1984)%60;if(yi<0)yi+=60;
  var mb=(y-1900)*12+m+12;
  var db=Math.floor((date-new Date(1900,0,1))/86400000)+40;
  return{
    year:TG[yi%10]+DZ[yi%12]+'（'+SX[yi%12]+'）年',
    month:TG[mb%10]+DZ[mb%12]+'月',
    day:TG[db%10]+DZ[db%12]+'日',
    dz:db%12
  };
}

var CSX=['马','羊','猴','鸡','狗','猪','鼠','牛','虎','兔','龙','蛇'];
var SHA=['南','北','西','东','南','北','西','东','南','北','西','东'];

var SCN=['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
var SCR=['23–01时','01–03时','03–05时','05–07时','07–09时','09–11时',
         '11–13时','13–15时','15–17时','17–19时','19–21时','21–23时'];
var SCY=['宜静养，深夜勿扰','丑牛耕耘，宜早起','寅虎精神，适运动',
         '卯兔祥和，宜见人','辰龙奋发，宜谋事','巳蛇蜕变，宜决断',
         '午马扬蹄，宜出行','未羊安逸，宜休憩','申猴机敏，宜交涉',
         '酉鸡归巢，宜收整','戌狗守夜，宜陪伴','亥猪安眠，宜养神'];
var JQ=[
  [1,6,'小寒'],[1,20,'大寒'],[2,4,'立春'],[2,19,'雨水'],
  [3,6,'惊蛰'],[3,21,'春分'],[4,5,'清明'],[4,20,'谷雨'],
  [5,6,'立夏'],[5,21,'小满'],[6,6,'芒种'],[6,21,'夏至'],
  [7,7,'小暑'],[7,23,'大暑'],[8,7,'立秋'],[8,23,'处暑'],
  [9,8,'白露'],[9,23,'秋分'],[10,8,'寒露'],[10,23,'霜降'],
  [11,7,'立冬'],[11,22,'小雪'],[12,7,'大雪'],[12,22,'冬至']
];
function getJQ(mo,da){
  for(var i=0;i<JQ.length;i++){
    if(JQ[i][0]==mo&&JQ[i][1]==da) return '今日节气 · '+JQ[i][2];
    if(JQ[i][0]==mo&&JQ[i][1]>da)  return '距 '+JQ[i][2]+' 还有 '+(JQ[i][1]-da)+' 天';
    if(JQ[i][0]==mo+1)              return '距 '+JQ[i][2]+' 约 '+(JQ[i][1]+(30-da))+' 天';
  }
  return '';
}
function isJQ(mo,da){
  for(var i=0;i<JQ.length;i++){if(JQ[i][0]==mo&&JQ[i][1]==da)return true;}
  return false;
}

var YP=['出行','祈福','嫁娶','开业','动土','裁衣','沐浴','纳财','会友','立券','移徙','修造','栽种','开仓','置业'];
var JP=['动土','安葬','词讼','伐木','开仓','破土','祭祀','嫁娶','移徙','造屋','掘井','入宅','行丧','开渠'];
function getYJ(date){
  var s=date.getFullYear()*10000+(date.getMonth()+1)*100+date.getDate();
  var yi=[],ji=[];
  for(var i=0;i<3;i++) yi.push(YP[(s*[3,7,11][i]+i*37)%YP.length]);
  for(var i=0;i<3;i++) ji.push(JP[(s*[2,5,9][i]+i*23+5)%JP.length]);
  return{yi:yi,ji:ji};
}

function buildCal(y,mo,tod){
  var g=document.getElementById('cal-grid');
  g.innerHTML='';
  document.getElementById('cal-header').textContent=y+'年  '+ME_CN[mo]+'  /  '+ME[mo];
  var dows=['日','一','二','三','四','五','六'];
  for(var i=0;i<7;i++){
    var d=document.createElement('div');d.className='dow';d.textContent=dows[i];g.appendChild(d);
  }
  var fd=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),pd=new Date(y,mo,0).getDate();
  for(var i=0;i<fd;i++){
    var d=document.createElement('div');d.className='day other';d.textContent=pd-fd+1+i;g.appendChild(d);
  }
  for(var i=1;i<=dim;i++){
    var d=document.createElement('div');
    var c='day';
    if(i===tod) c+=' today';
    if(isJQ(mo+1,i)) c+=' jq';
    d.className=c;d.textContent=i;g.appendChild(d);
  }
  var rem=(7-(fd+dim)%7)%7;
  for(var i=1;i<=rem;i++){
    var d=document.createElement('div');d.className='day other';d.textContent=i;g.appendChild(d);
  }
}

function pad(n){return n<10?'0'+n:''+n;}

function update(){
  var now=new Date(),h=now.getHours(),m=now.getMinutes();
  var mo=now.getMonth()+1,da=now.getDate();

  document.getElementById('time').textContent=pad(h)+':'+pad(m);

  var lu=getLunar(now);
  document.getElementById('lunar-date').textContent=
    '农历 '+(lu.leap?'闰':'')+LM[lu.month-1]+'月'+LD[lu.day-1];

  var gz=getGZ(now);
  document.getElementById('ganzhi').textContent=gz.year+'  '+gz.month+'  '+gz.day;

  document.getElementById('chong-sx').textContent='冲'+CSX[gz.dz];
  document.getElementById('sha-dir').textContent='煞'+SHA[gz.dz]+'方';

  var sci=h==23?0:Math.floor((h+1)/2);
  document.getElementById('sc-name').textContent=SCN[sci];
  document.getElementById('sc-range').textContent=SCR[sci];
  document.getElementById('sc-yun').textContent=SCY[sci];

  document.getElementById('s-jieqi').textContent=getJQ(mo,da);

  var yj=getYJ(now);
  document.getElementById('yi-list').innerHTML=yj.yi.map(function(w){return'<span class="yi">'+w+'</span>';}).join('');
  document.getElementById('ji-list').innerHTML=yj.ji.map(function(w){return'<span class="ji">'+w+'</span>';}).join('');

  buildCal(now.getFullYear(),now.getMonth(),da);
}

update();
setInterval(update,60000);
</script>
</body>
</html>
